<svg xmlns="http://www.w3.org/2000/svg" width="900" height="325" viewBox="0 0 900 325" role="img" aria-labelledby="title"><title id="title">Courbe ReLU avec entrées −2, 0 et 2</title><rect width="100%" height="100%" fill="#fbfcfe"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#334155"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#be123c"/></marker></defs><g font-family="Arial, sans-serif" fill="#172554"><text x="25" y="32" font-size="25" fill="#172554" text-anchor="start">ReLU : la sortie vaut max(0, entrée)</text><line x1="70" y1="250" x2="470" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="270" y1="290" x2="270" y2="75" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="80" y1="250" x2="270" y2="250" stroke="#0284c7" stroke-width="2.5"/><line x1="270" y1="250" x2="430" y2="90" stroke="#0284c7" stroke-width="2.5"/><text x="435" y="278" font-size="17" fill="#172554" text-anchor="start">entrée</text><text x="282" y="78" font-size="17" fill="#172554" text-anchor="start">sortie</text><circle cx="160" cy="250" r="5" fill="#0284c7"/><text x="168" y="235" font-size="18" fill="#172554" text-anchor="start">−2 → 0</text><circle cx="270" cy="250" r="5" fill="#0284c7"/><text x="278" y="235" font-size="18" fill="#172554" text-anchor="start">0 → 0</text><circle cx="390" cy="130" r="5" fill="#0284c7"/><text x="398" y="115" font-size="18" fill="#172554" text-anchor="start">2 → 2</text><text x="525" y="145" font-size="20" fill="#172554" text-anchor="start">Valeur négative → 0</text><text x="525" y="190" font-size="20" fill="#172554" text-anchor="start">Valeur positive → inchangée</text></g></svg>