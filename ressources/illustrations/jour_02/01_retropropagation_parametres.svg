<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="405" viewBox="0 0 1040 405" role="img" aria-labelledby="title"><title id="title">La perte calcule les gradients et l optimiseur corrige les poids et biais sans modifier les données</title><rect width="100%" height="100%" fill="#fbfcfe"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#334155"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#be123c"/></marker></defs><g font-family="Arial, sans-serif" fill="#172554"><text x="25" y="32" font-size="24" fill="#172554" text-anchor="start">Un exemple : x = 1, vraie réponse y = 3</text><text x="55" y="95" font-size="19" fill="#172554" text-anchor="start">entrée fixée</text><text x="55" y="130" font-size="20" fill="#172554" text-anchor="start">x = 1</text><text x="295" y="95" font-size="19" fill="#172554" text-anchor="start">paramètres actuels</text><text x="295" y="130" font-size="20" fill="#172554" text-anchor="start">w = 1 ; b = 0</text><text x="565" y="95" font-size="19" fill="#172554" text-anchor="start">prédiction</text><text x="565" y="130" font-size="20" fill="#172554" text-anchor="start">ŷ = w × x + b = 1</text><line x1="170" y1="123" x2="280" y2="123" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="495" y1="123" x2="550" y2="123" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="565" y="190" font-size="20" fill="#172554" text-anchor="start">Erreur au carré : (1 − 3)² = 4</text><text x="565" y="232" font-size="18" fill="#be123c" text-anchor="start">Le gradient indique : augmenter w et b</text><line x1="605" y1="249" x2="390" y2="249" stroke="#be123c" stroke-width="2.5" marker-end="url(#redarrow)"/><line x1="390" y1="249" x2="390" y2="152" stroke="#be123c" stroke-width="2.5" marker-end="url(#redarrow)"/><text x="245" y="292" font-size="19" fill="#be123c" text-anchor="start">Petit pas → w = 1,2 ; b = 0,2</text><text x="245" y="325" font-size="18" fill="#172554" text-anchor="start">Nouvelle prédiction = 1,4 ; nouvelle erreur = 2,56</text><text x="35" y="373" font-size="17" fill="#172554" text-anchor="start">La rétropropagation calcule les gradients. L’optimiseur modifie w et b ; x et y restent fixes.</text></g></svg>