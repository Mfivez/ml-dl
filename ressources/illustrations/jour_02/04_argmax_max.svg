<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title"><title id="title">Histogramme de quatre scores avec position maximum et valeur maximum</title><rect width="100%" height="100%" fill="#fbfcfe"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#334155"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#be123c"/></marker></defs><g font-family="Arial, sans-serif" fill="#172554"><text x="25" y="32" font-size="23" fill="#172554" text-anchor="start">Même ligne de scores : la classe et la confiance sont différentes</text><rect x="70" y="246.2" width="60" height="13.799999999999999" fill="#cbd5e1"/><text x="100" y="285" font-size="18" fill="#172554" text-anchor="middle">0</text><text x="100" y="234.2" font-size="18" fill="#172554" text-anchor="middle">0.06</text><rect x="170" y="234.7" width="60" height="25.3" fill="#cbd5e1"/><text x="200" y="285" font-size="18" fill="#172554" text-anchor="middle">1</text><text x="200" y="222.7" font-size="18" fill="#172554" text-anchor="middle">0.11</text><rect x="270" y="99.0" width="60" height="161.0" fill="#0284c7"/><text x="300" y="285" font-size="18" fill="#172554" text-anchor="middle">2</text><text x="300" y="87.0" font-size="18" fill="#172554" text-anchor="middle">0.70</text><rect x="370" y="230.1" width="60" height="29.900000000000002" fill="#cbd5e1"/><text x="400" y="285" font-size="18" fill="#172554" text-anchor="middle">3</text><text x="400" y="218.1" font-size="18" fill="#172554" text-anchor="middle">0.13</text><text x="600" y="130" font-size="23" fill="#172554" text-anchor="start">argmax → classe 2</text><text x="600" y="180" font-size="23" fill="#172554" text-anchor="start">max → confiance 0,70</text><text x="50" y="330" font-size="18" fill="#172554" text-anchor="start">Ces quatre nombres illustrent le calcul. Le modèle digits produit dix colonnes.</text></g></svg>